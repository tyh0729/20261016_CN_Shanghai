<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noimageindex">
<meta name="theme-color" content="#F3F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121618" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="旅行記帳">

<title>記帳・上海杭州蘇州</title>
<style>
/* 密碼頁：置中單欄，沿用網站配色；頂端三色條對應上海・杭州・蘇州 */
:root{
  --paper:#F3F5F2; --card:#FFFFFF; --ink:#1E2427; --muted:#5B656A; --line:#D7DDD9;
  --sh:#2D5A92; --hz:#1F7D68; --sz:#76519A; --seal:#B0382C;
  --f-disp:"Kaiti TC","BiauKai","DFKai-SB","KaiTi",serif;
  --f-body:"PingFang TC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--paper:#121618; --card:#1A1F22; --ink:#E3E8E5; --muted:#9BA5AA; --line:#2C3438;
    --sh:#8FB3E6; --hz:#6CC9AF; --sz:#C4A3E0; --seal:#E5796B; color-scheme:dark}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;display:flex;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.gate{width:100%;max-width:360px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:28px 22px 24px}
.bars{display:grid;grid-template-columns:5fr 2fr 2fr;gap:3px;margin-bottom:22px}
.bars span{height:5px;border-radius:3px;background:var(--c)}
h1{margin:0;font-family:var(--f-disp);font-size:1.6rem;font-weight:700;letter-spacing:.04em}
.sub{margin:4px 0 20px;color:var(--muted);font-size:14px}
form{display:grid;gap:12px}
label.pw-l{font-size:12px;color:var(--muted);letter-spacing:.1em}
input[type=password]{width:100%;font-size:18px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);letter-spacing:.08em}
input[type=password]:focus{outline:2px solid var(--sh);outline-offset:1px}
.rem{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted);cursor:pointer}
.rem input{width:18px;height:18px;margin:0;accent-color:var(--sh)}
.err{margin:0;color:var(--seal);font-size:14px;font-weight:600}
button{min-height:48px;border:0;border-radius:10px;background:var(--ink);color:var(--paper);font:700 16px var(--f-body);cursor:pointer}
button:disabled{opacity:.6;cursor:progress}
button:focus-visible{outline:2px solid var(--sh);outline-offset:2px}
.busy{display:none;text-align:center;color:var(--muted)}
html.auto .gate form,html.auto .gate .sub{display:none}
html.auto .busy{display:block}
</style>
</head>
<body>
<main class="gate">
  <div class="bars" aria-hidden="true"><span style="--c:var(--sh)"></span><span style="--c:var(--hz)"></span><span style="--c:var(--sz)"></span></div>
  <h1>請輸入密碼</h1>
  <p class="sub">這個頁面只給同行的人看。</p>
  <p class="busy">解鎖中…</p>
  <form id="f" novalidate>
    <label class="pw-l" for="pw">密碼</label>
    <input id="pw" type="password" autocomplete="current-password" enterkeyhint="go" autofocus>
    <label class="rem"><input type="checkbox" id="rem" checked>記住這支手機，下次不用再輸入</label>
    <p class="err" id="err" role="alert" hidden></p>
    <button type="submit" id="go">進入</button>
  </form>
  <noscript><p class="err">需要開啟 JavaScript 才能看這個頁面。</p></noscript>
</main>

<script>
(() => {
  'use strict';
  const KEY = 'trip-gate-key';
  const $ = id => document.getElementById(id);
  const D = JSON.parse($('enc').textContent);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const tob64 = u => btoa(String.fromCharCode.apply(null, u));
  const showErr = msg => { $('err').textContent = msg; $('err').hidden = !msg; };

  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
  if (!window.crypto || !crypto.subtle) { showErr('這個瀏覽器無法解密，請改用 Safari 或 Chrome 開啟網址。'); $('go').disabled = true; return; }

  async function decrypt(raw) {
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(D.iv) }, key, b64(D.ct));
    return new TextDecoder().decode(pt);
  }
  async function derive(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: b64(D.salt), iterations: D.iter, hash: 'SHA-256' }, base, 256);
    return new Uint8Array(bits);
  }
  // 文件還在解析時 document.open() 會失效、內容被接在密碼頁後面，所以等解析完再換頁
  const parsed = new Promise(res => {
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => setTimeout(res, 0), { once: true });
    else setTimeout(res, 0);
  });
  async function show(html) {
    await parsed;
    const hash = location.hash;  // 換頁前先記下，頁面程式可能會改網址的 #
    document.open(); document.write(html); document.close();
    if (hash) {
      const el = document.getElementById(decodeURIComponent(hash.slice(1)));
      if (el) setTimeout(() => el.scrollIntoView(), 0);
    }
  }
  function readSaved() {
    for (const store of [localStorage, sessionStorage]) {
      try { const o = JSON.parse(store.getItem(KEY) || 'null'); if (o && o.salt === D.salt && o.k) return o; } catch (e) { /* 讀不到就要輸入 */ }
    }
    return null;
  }
  function forget() { for (const s of [localStorage, sessionStorage]) { try { s.removeItem(KEY); } catch (e) { /* ignore */ } } }

  const saved = readSaved();
  if (saved) {
    document.documentElement.classList.add('auto');
    decrypt(b64(saved.k)).then(show).catch(() => {
      forget();
      document.documentElement.classList.remove('auto');
      $('pw').focus();
    });
  }

  $('f').addEventListener('submit', async e => {
    e.preventDefault();
    const pw = $('pw').value;
    if (!pw) { showErr('請輸入密碼'); $('pw').focus(); return; }
    showErr('');
    $('go').disabled = true; $('go').textContent = '解鎖中…';
    let html;
    try {
      const raw = await derive(pw);
      html = await decrypt(raw);
      const rec = JSON.stringify({ salt: D.salt, k: tob64(raw) });
      try { ($('rem').checked ? localStorage : sessionStorage).setItem(KEY, rec); } catch (e2) { /* 無法記住也照樣進入 */ }
    } catch (err) {
      showErr('密碼不對，請再試一次');
      $('go').disabled = false; $('go').textContent = '進入';
      $('pw').select();
      return;
    }
    show(html);
  });
})();
